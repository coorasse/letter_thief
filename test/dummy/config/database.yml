<% def database_name_from(name); (ENV.fetch("TARGET_DB", "sqlite") == "sqlite") ? "storage/#{name}.sqlite3" : name; end %>

<% if ENV.fetch("TARGET_DB", "sqlite") == "mysql" %>
default: &default
  adapter: mysql2
  username: root
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: "127.0.0.1"
  port: 3306

<% elsif ENV.fetch("TARGET_DB", "sqlite") == "postgres" %>
default: &default
  adapter: postgresql
  encoding: unicode
#  username: postgres
  pool: 5
#  host: localhost

<% elsif ENV.fetch("TARGET_DB", "sqlite") == "sqlite" %>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 50 } %>
  timeout: 60
<% end %>

<% if ENV["LETTER_THIEF_SEPARATE_DB"] == "true" %>
development:
  primary:
    <<: *default
    database: <%= database_name_from("development") %>
    migrations_paths: <%= Rails.root.join("db/migrate") %>
  letter_thief:
    <<: *default
    database: <%= database_name_from("letter_thief_development") %>
    migrations_paths: <%= Rails.root.join("db/letter_thief_migrate") %>

test:
  primary:
    <<: *default
    database: <%= database_name_from("test") %>
    migrations_paths: <%= Rails.root.join("db/migrate") %>
  letter_thief:
    <<: *default
    database: <%= database_name_from("letter_thief_test") %>
    migrations_paths: <%= Rails.root.join("db/letter_thief_migrate") %>
<% else %>
development:
  <<: *default
  database: <%= database_name_from("development") %>
  migrations_paths:
    - <%= Rails.root.join("db/migrate") %>
    - <%= Rails.root.join("db/letter_thief_migrate") %>

test:
  <<: *default
  database: <%= database_name_from("test") %>
  migrations_paths:
    - <%= Rails.root.join("db/migrate") %>
    - <%= Rails.root.join("db/letter_thief_migrate") %>
<% end %>
